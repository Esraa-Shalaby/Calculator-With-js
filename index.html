<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div id="calculater">
            <input type="text" id="display" readonly>
            <div id="Keys">
                <button onclick="clearDisplay()" class="color">AC</button>
                <button onclick="appanedToDisplay('/')">/</button>
                <button onclick="appanedToDisplay('+')">+</button>
                <button onclick="appanedToDisplay('-')">-</button>
                <button onclick="appanedToDisplay('7')">7</button>
                <button onclick="appanedToDisplay('8')">8</button>
                <button onclick="appanedToDisplay('9')">9</button>
                <button onclick="appanedToDisplay('*')">*</button>
                <button onclick="appanedToDisplay('4')">4</button>
                <button onclick="appanedToDisplay('5')">5</button>
                <button onclick="appanedToDisplay('6')">6</button>
                <button onclick="appanedToDisplay('.')">.</button>
                <button onclick="appanedToDisplay('1')">1</button>
                <button onclick="appanedToDisplay('2')">2</button>
                <button onclick="appanedToDisplay('3')">3</button>
                <button onclick="appanedToDisplay('0')">0</button>
                <button onclick="Calculate()" class="color">=</button>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>

</html>
